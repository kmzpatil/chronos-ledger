<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chronos Shield Active</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #0B0B0C;
      color: #F2F0EB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background-color: #131315;
      border: 1px solid #242428;
      border-radius: 16px;
      padding: 32px;
      box-shadow: inset 0 1px 0 0 rgba(255, 250, 240, 0.05);
    }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(46, 158, 107, 0.12);
      border: 1px solid rgba(46, 158, 107, 0.4);
      color: #2E9E6B;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
    }
    h1 {
      font-size: 22px;
      margin: 16px 0 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #9A9893;
      margin: 0 0 24px;
    }
    .domain {
      color: #F2F0EB;
      font-family: ui-monospace, monospace;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      background-color: #D99B26;
      color: #0B0B0C;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="pill">SHIELD ENGAGED</span>
    <h1>Access Locked by Chronos</h1>
    <p>
      <span id="domain-label" class="domain">This domain</span> is currently shielded to protect your deep focus balance. Hold 2.0s inside Command Center to buy a timed pass with earned credits.
    </p>
    <a class="btn" href="http://localhost:3000/">Open Chronos Command Center</a>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
